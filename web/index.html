<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A cross-platform To Do List app with tasks, categories and priority.">
  <meta name="theme-color" content="#4A6CF7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TodoList">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Todo List</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 启动占位：在 Flutter 引擎加载完成前立即显示，消除白屏 (V1.4 优化 A) */
    html, body { margin: 0; padding: 0; height: 100%; background: #f5f6fa; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4A6CF7;
      z-index: 9999;
    }
    #loading .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #6D8BFF, #4A6CF7);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 34px; font-weight: 800;
      box-shadow: 0 10px 30px rgba(74,108,247,0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #loading .name { margin-top: 18px; font-size: 18px; font-weight: 700; }
    #loading .tip  { margin-top: 8px; font-size: 13px; color: #9aa0b4; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(0.92); opacity: 0.75; }
    }
    /* 错误态：splash 被替换为可读错误 */
    #loading.error .logo { background: #ff5b5b; animation: none; }
    #loading.error .name { color: #ff5b5b; }
    #loading.error .tip  { color: #555; max-width: 80vw; text-align: center; line-height: 1.5; }
    #loading.error .tip button {
      margin-top: 14px;
      padding: 8px 18px;
      border: none; border-radius: 8px;
      background: #4A6CF7; color: #fff; font-size: 14px;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <!-- 启动占位（Flutter 渲染首帧后自动移除） -->
  <div id="loading">
    <div class="logo">T</div>
    <div class="name">Todo List</div>
    <div class="tip">加载中…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // V1.4 优化 B：错误兜底。
    // 浏览器翻译插件（如 Immersive Translate）有时会与 Flutter 引擎冲突，
    // 导致页面卡在 splash。本段捕获全局 JS 错误并在 8 秒后仍无首帧
    // 时弹出可读提示，让用户能区分"加载慢"和"真的出问题"。
    (function () {
      const loading = document.getElementById('loading');
      const tip = loading ? loading.querySelector('.tip') : null;
      let reported = false;
      function showError(msg, hint) {
        if (reported || !tip) return;
        reported = true;
        loading.classList.add('error');
        const safe = String(msg).replace(/[<&>]/g, c => ({'<':'&lt;','&':'&amp;','>':'&gt;'})[c]);
        tip.innerHTML = '页面初始化失败<br><small style="opacity:.7">' + safe + '</small><br>' +
          '<small style="opacity:.7">' + hint + '</small>' +
          '<br><button onclick="location.reload()">重新加载</button>';
      }
      // 1) 同步 JS 错误（含翻译插件覆盖 Object.f 等）
      window.addEventListener('error', function (e) {
        showError((e && e.message) || 'unknown error',
          '如果是浏览器翻译插件导致，请关闭后刷新，或打开无痕窗口访问。');
      });
      // 2) 未处理的 Promise 拒绝（例如 main.dart.js 加载失败）
      window.addEventListener('unhandledrejection', function (e) {
        showError((e && e.reason && (e.reason.message || e.reason.toString())) || 'load failed',
          '请检查网络，刷新页面重试。');
      });
      // 3) 兜底：8 秒后如果 loading 还可见（说明 Flutter 未接管首帧），提示用户继续等或检查
      setTimeout(function () {
        if (!reported && loading && loading.isConnected && document.body.contains(loading)) {
          // 不强制报错误，只更新提示让用户知道在等（避免误报慢网络）
          if (tip && /加载中/.test(tip.textContent)) {
            tip.innerHTML = '首屏加载较慢，请稍候…<br><small style="opacity:.7">若长时间空白，可关闭浏览器翻译插件后刷新。</small>';
          }
        }
      }, 8000);
    })();
  </script>
</body>
</html>
