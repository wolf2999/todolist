<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A clean, cross-platform To-Do List app with tasks, categories, priority and local persistence. Try it free in your browser.">
  <meta name="theme-color" content="#4A6CF7">

  <!-- ============ Open Graph / Twitter Card (社群分享卡片) ============ -->
  <!-- 部署到 Cloudflare Pages 后的正式域名 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="To-Do List">
  <meta property="og:title" content="To-Do List — A clean, cross-platform todo app">
  <meta property="og:description" content="Manage tasks, categories and priority with a beautiful cross-platform To-Do List. Runs in your browser, no install needed.">
  <meta property="og:url" content="https://atodolist.pages.dev/">
  <meta property="og:image" content="https://atodolist.pages.dev/icons/Icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="To-Do List app icon">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="To-Do List — A clean, cross-platform todo app">
  <meta name="twitter:description" content="Manage tasks, categories and priority with a beautiful cross-platform To-Do List. Runs in your browser, no install needed.">
  <meta name="twitter:image" content="https://atodolist.pages.dev/icons/Icon-512.png">
  <meta name="twitter:image:alt" content="To-Do List app icon">
  <!-- =================================================================== -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TodoList">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Todo List</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 启动占位：在 Flutter 引擎加载完成前立即显示，消除白屏 (V1.4 优化 A) */
    html, body { margin: 0; padding: 0; height: 100%; background: #f5f6fa; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4A6CF7;
      z-index: 9999;
    }
    #loading .logo {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #6D8BFF, #4A6CF7);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 34px; font-weight: 800;
      box-shadow: 0 10px 30px rgba(74,108,247,0.35);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #loading .name { margin-top: 18px; font-size: 18px; font-weight: 700; }
    #loading .tip  { margin-top: 8px; font-size: 13px; color: #9aa0b4; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(0.92); opacity: 0.75; }
    }
    /* 错误态：splash 被替换为可读错误 */
    #loading.error .logo { background: #ff5b5b; animation: none; }
    #loading.error .name { color: #ff5b5b; }
    #loading.error .tip  { color: #555; max-width: 80vw; text-align: center; line-height: 1.5; }
    #loading.error .tip button {
      margin-top: 14px;
      padding: 8px 18px;
      border: none; border-radius: 8px;
      background: #4A6CF7; color: #fff; font-size: 14px;
      cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
  <!-- 启动占位（Flutter 渲染首帧后自动移除） -->
  <div id="loading">
    <div class="logo">T</div>
    <div class="name">Todo List</div>
    <div class="tip">加载中…</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // V1.4.6 修复：splash(#loading) 的移除改由 Dart 端 _Bootstrap 在首帧绘制后执行，
    // 这样 splash 能完整盖住字体/资源加载等待期，避免手机慢网白屏。
    // 本段仅保留“超时兜底”：若 20 秒内 Flutter 仍未接管 DOM（引擎加载失败/网络问题），
    // 且 #loading 仍存在，则把 splash 换成可读错误提示而非无限糊着或纯白屏。
    (function () {
      const loading = document.getElementById('loading');
      if (!loading) return;
      function flutterReady() {
        if (document.querySelector('flt-glass-pane, flt-scene-host, flutter-view')) return true;
        if (document.getElementsByTagName('canvas').length > 0) return true;
        return false;
      }
      // 超时兜底：20 秒后若 #loading 仍在且 Flutter 未接管，给出可读提示。
      setTimeout(function () {
        const el = document.getElementById('loading');
        if (!el) return; // Dart 端已移除（首屏正常），无需处理。
        if (!flutterReady()) {
          el.classList.add('error');
          const tip = el.querySelector('.tip');
          if (tip) {
            tip.innerHTML = '页面加载超时<br><small style="opacity:.7">'
              + '请刷新重试；若手机浏览器仍白屏，多半是网络加载引擎慢，'
              + '建议切换 Wi-Fi 或使用 Chrome/Safari 无痕窗口访问。</small><br>'
              + '<button onclick="location.reload()">重新加载</button>';
          }
        }
      }, 20000);
    })();
  </script>

  <script>
    // V1.4 优化 B：错误兜底。
    // 浏览器翻译插件（如 Immersive Translate）有时会与 Flutter 引擎冲突，
    // 导致页面卡在 splash。本段捕获全局 JS 错误并弹可读提示。
    (function () {
      const loading = document.getElementById('loading');
      const tip = loading ? loading.querySelector('.tip') : null;
      let reported = false;
      function showError(msg, hint) {
        if (reported || !tip) return;
        reported = true;
        loading.classList.add('error');
        const safe = String(msg).replace(/[<&>]/g, c => ({'<':'&lt;','&':'&amp;','>':'&gt;'})[c]);
        tip.innerHTML = '页面初始化失败<br><small style="opacity:.7">' + safe + '</small><br>' +
          '<small style="opacity:.7">' + hint + '</small>' +
          '<br><button onclick="location.reload()">重新加载</button>';
      }
      window.addEventListener('error', function (e) {
        showError((e && e.message) || 'unknown error',
          '如果是浏览器翻译插件导致，请关闭后刷新，或打开无痕窗口访问。');
      });
      window.addEventListener('unhandledrejection', function (e) {
        showError((e && e.reason && (e.reason.message || e.reason.toString())) || 'load failed',
          '请检查网络，刷新页面重试。');
      });
    })();
  </script>
</body>
</html>
