<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言板 · ToDoList</title>
  <style>
    :root {
      --purple: #7a5cff;
      --purple-dark: #5b3fd6;
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #2a2a35;
      --muted: #8a8a99;
      --border: #e6e6ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    header .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--purple); }
    header h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px 22px; }
    .composer {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
    }
    textarea {
      width: 100%;
      border: none;
      resize: none;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
      min-height: 64px;
    }
    .composer .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .count { font-size: 12px; color: var(--muted); }
    button.send {
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.send:disabled { opacity: .5; cursor: not-allowed; }
    .msg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .msg .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
    .err { color: #d6453d; font-size: 13px; margin: 6px 0 0; min-height: 18px; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 10px 18px; border-radius: 20px;
      font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: .92; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="dot"></span>
      <h1>留言板</h1>
    </header>
    <p class="sub">任何人都可以留言，请文明发言。无需登录。</p>

    <div class="composer">
      <textarea id="input" maxlength="500" placeholder="说点什么…"></textarea>
      <div class="bar">
        <span class="count"><span id="len">0</span>/500</span>
        <button class="send" id="send">发送</button>
      </div>
      <p class="err" id="err"></p>
    </div>

    <div id="list"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const API = '/api/messages';
    const $ = (id) => document.getElementById(id);
    const input = $('input'), sendBtn = $('send'), errEl = $('err'),
          listEl = $('list'), lenEl = $('len'), toast = $('toast');

    input.addEventListener('input', () => { lenEl.textContent = input.value.length; });

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function fmt(ts) {
      const d = new Date(ts);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function load() {
      try {
        const r = await fetch(API, { cache: 'no-store' });
        const data = await r.json();
        const msgs = (data.messages || []).slice().reverse(); // 最新的在最上
        if (msgs.length === 0) {
          listEl.innerHTML = '<div class="empty">还没有留言，快来抢沙发 🛋️</div>';
          return;
        }
        listEl.innerHTML = msgs.map((m) => `
          <div class="msg">
            <div>${escapeHtml(m.content)}</div>
            <div class="meta">${fmt(m.created_at)}</div>
          </div>`).join('');
      } catch (e) {
        listEl.innerHTML = '<div class="empty">加载失败，请刷新重试。</div>';
      }
    }

    async function post() {
      const content = input.value.trim();
      errEl.textContent = '';
      if (!content) { errEl.textContent = '内容不能为空。'; return; }
      sendBtn.disabled = true;
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ content }),
        });
        const data = await r.json();
        if (!r.ok) {
          errEl.textContent = data.error || '发送失败。';
          return;
        }
        input.value = ''; lenEl.textContent = '0';
        showToast('已发送');
        await load();
      } catch (e) {
        errEl.textContent = '网络错误，请重试。';
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', post);
    input.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') post();
    });

    load();
  </script>
</body>
</html>
