name: todolist
description: "A cross-platform To Do List app built with Flutter (MVC architecture)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (part of the MVC controller layer)
  provider: ^6.1.2

  # Local persistence for tasks / categories / settings
  shared_preferences: ^2.3.2

  # File export/import for backup & restore (V1.1)
  path_provider: ^2.1.3

  # Cross-platform file picker (import) & share sheet (export) for backup (V1.2)
  file_picker: ^8.0.0
  share_plus: ^10.0.0

  # Open download links from the home header (V1.3 下载入口)
  url_launcher: ^6.3.0

  # Date formatting helpers
  intl: ^0.19.0

  # Multi-language support (简体中文 / 繁体中文 / English) — V1.4
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/i18n/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik/Rubik-Black.ttf
          weight: 900
        - asset: assets/fonts/Rubik/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik/Rubik-Regular.ttf
          weight: 400
