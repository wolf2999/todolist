name: Release APK & Windows

# 触发方式：
#   1) 推送形如 v1.0.2 的 tag 时，自动构建并发布正式 Release。
#   2) 在 Actions 页面点 “Run workflow” 手动冒烟测试（可选填版本号）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (仅手动触发时使用，如 1.0.1；tag 触发时忽略)'
        required: false
        default: '1.0.1'

# 授予创建 Release 的权限
permissions:
  contents: write

jobs:
  # ===================== Android (arm64) =====================
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Android SDK 需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a only)
        # 仅出 arm64 包，体积约 12MB，避免大体积；如需全架构可去掉 --split-per-abi
        run: flutter build apk --release --split-per-abi

      - name: Rename artifact (固定名, 供 latest/download 稳定链接)
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk todoist-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: todoist-android.apk
          if-no-files-found: error

  # ===================== Windows 安装包 =====================
  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup (via Chocolatey)
        # windows-latest runner 自带 choco,装好后 iscc.exe 在 PATH 中可用
        run: choco install innosetup -y --no-progress

      - name: Package installer with Inno Setup
        shell: pwsh
        run: |
          if ('${{ startsWith(github.ref, 'refs/tags/') }}' -eq 'true') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '${{ github.event.inputs.version }}'
          }
          # 64-bit 安装路径
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/windows/todolist.iss" /DAppVersion="$version"

      - name: Rename installer (固定名, 供 latest/download 稳定链接)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "packaging/windows/Output/todolist-setup-*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "todolist-windows.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: todoist-windows.exe
          if-no-files-found: error

  # ===================== 发布 Release =====================
  release:
    name: Create GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag & version
        id: meta
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            TAG="ci-${{ github.run_number }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: To-Do List ${{ steps.meta.outputs.tag }}
          # 手动冒烟测试不打正式 Release（不标记为 Latest），避免污染 latest/download
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          body: |
            ## To-Do List ${{ steps.meta.outputs.tag }} (v${{ steps.meta.outputs.version }})

            ### 下载（GitHub Release 附件）
            - **Android** (arm64-v8a): `todolist-android.apk`
            - **Windows** (安装包): `todolist-windows.exe`

            ### 说明
            - Android 仅需 arm64 架构安装包，主流手机均支持。
            - Windows 为自解压安装器，首次运行若被 SmartScreen 拦截，请点击“仍要运行”（无 EV 代码签名证书时的正常现象）。
            - 仅 tag 触发的正式版本才会更新 `latest/download` 链接；手动冒烟测试标记为 pre-release。
          files: |
            artifacts/android-apk/todoist-android.apk
            artifacts/windows-installer/todoist-windows.exe
