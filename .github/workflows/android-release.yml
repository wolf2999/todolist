name: Android APK Release

# 触发方式：
#   1) 推送形如 v1.0.2 的 tag 时，自动构建并发布正式 Release。
#   2) 在 Actions 页面点 “Run workflow” 手动冒烟测试（可选填版本号）。
# 说明：本 workflow 只负责 Android APK。Windows 安装包由 windows-release.yml 负责，
#       两者对同一个 tag 各自 upsert 同一个 GitHub Release，后跑的会追加附件，最终合并。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (仅手动触发时使用，如 1.0.1；tag 触发时忽略)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Android SDK 需要)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a only)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifact (固定名, 供 latest/download 稳定链接)
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk todoist-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: todoist-android.apk
          if-no-files-found: error

  release:
    name: Publish Release (APK)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag & version
        id: meta
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            TAG="ci-${{ github.run_number }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: To-Do List ${{ steps.meta.outputs.tag }}
          # 手动冒烟测试不打正式 Release（不标记为 Latest），避免污染 latest/download
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          append_body: false
          body: |
            ## To-Do List ${{ steps.meta.outputs.tag }} (v${{ steps.meta.outputs.version }})

            ### 下载（GitHub Release 附件）
            - **Android** (arm64-v8a): `todolist-android.apk`
            - **Windows** (安装包): `todolist-windows.exe`（见 windows-release 工作流）

            ### 说明
            - Android 仅需 arm64 架构安装包，主流手机均支持。
            - 仅 tag 触发的正式版本才会更新 `latest/download` 链接；手动冒烟测试标记为 pre-release。
          files: |
            artifacts/todoist-android.apk
