name: Windows Zip Release

# 触发方式：
#   1) 推送形如 v1.0.2 的 tag 时，自动构建并发布正式 Release。
#   2) 在 Actions 页面点 “Run workflow” 手动冒烟测试（可选填版本号）。
# 说明：本 workflow 只负责 Windows 版本。Android APK 由 android-release.yml 负责，
#       两者对同一个 tag 各自 upsert 同一个 GitHub Release，后跑的会追加附件，最终合并。
#
# 当前方案：在 windows-latest 上用 Flutter 正常构建 Windows Release，再用 PowerShell 的
#          Compress-Archive 直接打包成 todolist-windows.zip（免安装、解压即用）。
#          注意：Flutter 不支持在非 Windows 主机上交叉编译 Windows 目标，故必须用 windows runner。
#          windows-latest runner 不预装 Visual Studio，需先用 microsoft/setup-msbuild@v2
#          装 VS 2022 Build Tools（Flutter 3.29 用的 CMake Generator 才会找到编译器）。
#          本方案不再依赖 Inno Setup（仅压缩），所以不需要 .iss 脚本，也避免“no instance of VS”报错。
#
#          后续若需要正式安装器（.exe），再加一条 windows-installer.yml（同样依赖 VS 工具链，再加 Inno Setup）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (仅手动触发时使用，如 1.0.1；tag 触发时忽略)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Visual Studio 2022 Build Tools
        # Flutter 在 windows 上构建需要 MSVC 编译器（CMake Generator: Visual Studio）。
        # windows-latest runner 不预装 VS，须显式装 Build Tools。
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Package as zip (固定名, 供 latest/download 稳定链接)
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          # 剔除体积大且无用的符号/调试文件
          $bin = "pkg"
          if (Test-Path $bin) { Remove-Item $bin -Recurse -Force }
          New-Item -ItemType Directory -Path $bin | Out-Null
          Copy-Item "$src\*" -Destination $bin -Recurse
          Get-ChildItem $bin -Include *.pdb,*.exp,*.lib -Recurse | Remove-Item -Force
          Compress-Archive -Path "$bin\*" -DestinationPath "todolist-windows.zip" -Force

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: todolist-windows.zip
          if-no-files-found: error

  release:
    name: Publish Release (Windows)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag & version
        id: meta
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            TAG="ci-${{ github.run_number }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: To-Do List ${{ steps.meta.outputs.tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          append_body: false
          body: |
            ## To-Do List ${{ steps.meta.outputs.tag }} (v${{ steps.meta.outputs.version }})

            ### 下载（GitHub Release 附件）
            - **Android** (arm64-v8a): `todolist-android.apk`（见 android-release 工作流）
            - **Windows** (免安装 zip): `todolist-windows.zip`

            ### 说明
            - Windows 为免安装版本：解压 `todolist-windows.zip` 后运行 `todolist.exe` 即可。
            - 仅 tag 触发的正式版本才会更新 `latest/download` 链接；手动冒烟测试标记为 pre-release。
          files: |
            artifacts/todolist-windows.zip
