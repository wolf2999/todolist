name: Windows Zip Release

# 触发方式：
#   1) 推送形如 v1.0.2 的 tag 时，自动构建并发布正式 Release。
#   2) 在 Actions 页面点 “Run workflow” 手动冒烟测试（可选填版本号）。
# 说明：本 workflow 只负责 Windows 版本。Android APK 由 android-release.yml 负责，
#       两者对同一个 tag 各自 upsert 同一个 GitHub Release，后跑的会追加附件，最终合并。
#
# 当前方案：在 Ubuntu 上交叉编译 Windows 可执行文件（clang + mingw-w64），打包成
#          todolist-windows.zip 直接分发（免安装、解压即用）。
#          后续若需要正式安装器（.exe），再加一条 windows-installer.yml（windows-latest + Inno Setup）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (仅手动触发时使用，如 1.0.1；tag 触发时忽略)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Windows (zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Install cross-compile toolchain (clang + mingw-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            mingw-w64 wine64

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release, cross-compile)
        run: flutter build windows --release

      - name: Package as zip (固定名, 供 latest/download 稳定链接)
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="ci-${{ github.run_number }}"
          fi
          SRC="build/windows/x64/runner/Release"
          # 仅打包核心产物，剔除体积大且无用的符号/调试文件
          mkdir -p pkg
          cp -r "$SRC"/* pkg/ 2>/dev/null || true
          rm -f pkg/*.pdb pkg/*.exp pkg/*.lib 2>/dev/null || true
          ( cd pkg && zip -r "../todolist-windows.zip" . )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: todolist-windows.zip
          if-no-files-found: error

  release:
    name: Publish Release (Windows)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag & version
        id: meta
        shell: bash
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            TAG="ci-${{ github.run_number }}"
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: To-Do List ${{ steps.meta.outputs.tag }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          append_body: false
          body: |
            ## To-Do List ${{ steps.meta.outputs.tag }} (v${{ steps.meta.outputs.version }})

            ### 下载（GitHub Release 附件）
            - **Android** (arm64-v8a): `todolist-android.apk`（见 android-release 工作流）
            - **Windows** (免安装 zip): `todolist-windows.zip`

            ### 说明
            - Windows 为免安装版本：解压 `todolist-windows.zip` 后运行 `todolist.exe` 即可。
            - 仅 tag 触发的正式版本才会更新 `latest/download` 链接；手动冒烟测试标记为 pre-release。
          files: |
            artifacts/todolist-windows.zip
